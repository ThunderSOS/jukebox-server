<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
    "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">

<ui:composition xmlns = "http://www.w3.org/1999/xhtml"
                xmlns:f = "http://java.sun.com/jsf/core"
                xmlns:h = "http://java.sun.com/jsf/html"
                xmlns:ui = "http://xmlns.jcp.org/jsf/facelets"
                xmlns:c = "jakarta.tags.core">

    <f:view>
        <h:panelGroup id="menu">
            <h:form>
                <h:commandButton id="hiddenRefreshBtn" binding="#{sessionBean.hiddenButton}" type="button" style="display:none;">
                    <f:ajax event="click" render="menu" />
                </h:commandButton>

                <h:outputScript>startPolling("#{sessionBean.hiddenButton.clientId}");</h:outputScript>

                <table>
                    <tr>
                        <td>
                            <table align="left">
                                <tr>
                                    <td class="list-header">Menu</td>
                                </tr>
                            </table>
                        </td>
                    </tr>
                    <tr>
                        <td>
                            <h:panelGroup rendered="#{!sessionBean.loggedIn}">
                                <tr>
                                    <td>
                                        <h:commandLink action="#{sessionBean.login()}" value="Login" class="navigation-link-large">
                                            <f:ajax execute="@this" render="menu" />
                                        </h:commandLink>
                                    </td>
                                </tr>
                            </h:panelGroup>

                            <h:panelGroup rendered="#{sessionBean.loggedIn}">
                                <h:panelGroup rendered="#{!sessionBean.loadInProgress}">
                                    <tr>
                                        <td>
                                            <h:commandLink action="#{sessionBean.startLoad()}" value="Load" class="navigation-link-large">
                                                <f:ajax execute="@this" render="menu" />
                                            </h:commandLink>
                                        </td>
                                    </tr>
                                    <tr>
                                        <td>
                                            <h:commandLink action="#{sessionBean.logout()}" value="Logout" class="navigation-link-large">
                                                <f:ajax execute="@this" render="menu" />
                                            </h:commandLink>
                                        </td>
                                    </tr>
                                    <h:outputScript>stopPolling();</h:outputScript>
                                </h:panelGroup>
                                <h:panelGroup rendered="#{sessionBean.loadInProgress}">
                                    <tr>
                                        <td>
                                            <h:outputText value="Load in progress..." class="track-owner" />
                                        </td>
                                    </tr>
                                </h:panelGroup>                                    
                            </h:panelGroup>
                        </td>
                    </tr>
                </table>
            </h:form>
        </h:panelGroup>
    </f:view>
</ui:composition>
